plugins {
    id 'com.android.application' version '8.11.1'
}

android {
    namespace 'app.gammama.scales'
    compileSdk 35

    defaultConfig {
        applicationId 'app.gammama.scales'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '1.8.0'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
